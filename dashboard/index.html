<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PulseWise — Internal Dashboard</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f262e;
    --border: #2a313a;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --success: #3fb950;
    --failure: #f85149;
    --retry: #d29922;
    --ignored: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .full { grid-column: 1 / -1; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel h2 {
    margin: 0;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .panel .body { padding: 12px 16px; }
  .feed { max-height: 520px; overflow-y: auto; }
  .feed table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .feed th, .feed td {
    padding: 6px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .feed th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel-2); }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
  }
  .pill.success { background: rgba(63,185,80,0.15); color: var(--success); }
  .pill.failure { background: rgba(248,81,73,0.15); color: var(--failure); }
  .pill.retry   { background: rgba(210,153,34,0.15); color: var(--retry); }
  .pill.ignored { background: rgba(139,148,158,0.15); color: var(--ignored); }
  .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .product-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    background: var(--panel-2);
  }
  .product-card h3 { margin: 0 0 8px; font-size: 14px; }
  .metric-row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 12px; }
  .metric-row .label { color: var(--muted); }
  .insight {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    background: var(--panel-2);
    margin-bottom: 12px;
  }
  .insight h3 { margin: 0 0 6px; font-size: 14px; }
  .insight .narrative { margin: 0 0 8px; color: var(--text); font-size: 13px; }
  .insight ul { margin: 6px 0 0 18px; padding: 0; }
  .insight li { font-size: 12px; margin: 2px 0; color: var(--text); }
  .anomalies { padding: 0; margin: 0; list-style: none; }
  .anomalies li {
    padding: 8px 12px;
    margin: 6px 0;
    border-left: 3px solid var(--failure);
    background: rgba(248,81,73,0.08);
    color: var(--failure);
    font-size: 13px;
    border-radius: 0 4px 4px 0;
  }
  .anomalies li.empty {
    border-left-color: var(--success);
    background: rgba(63,185,80,0.08);
    color: var(--success);
  }
  .empty-state { color: var(--muted); font-style: italic; padding: 12px 16px; }
  code { font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>PulseWise — Internal Dashboard</h1>
  <div class="meta" id="meta">loading…</div>
</header>

<div class="container">
  <section class="panel full">
    <h2>Anomalies</h2>
    <div class="body"><ul id="anomalies" class="anomalies"></ul></div>
  </section>

  <section class="panel full">
    <h2>Product Health (last 1h)</h2>
    <div class="body"><div id="health" class="product-grid"></div></div>
  </section>

  <section class="panel">
    <h2>Insights (last 24h)</h2>
    <div class="body" id="insights"></div>
  </section>

  <section class="panel">
    <h2>Live Feed (last 50 events)</h2>
    <div class="feed">
      <table>
        <thead><tr>
          <th>time</th><th>product</th><th>event</th><th>outcome</th>
          <th>latency</th><th>conf.</th><th>provider</th>
        </tr></thead>
        <tbody id="feed"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const REFRESH_MS = 60000;
const fmt = {
  pct: (v) => v == null ? "—" : (v * 100).toFixed(1) + "%",
  ms:  (v) => v == null ? "—" : Math.round(v) + "ms",
  usd: (v) => v == null ? "—" : "$" + Number(v).toFixed(4),
  conf: (v) => v == null ? "—" : Number(v).toFixed(2),
  time: (iso) => {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  },
};

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}

function renderAnomalies(products) {
  const ul = document.getElementById("anomalies");
  ul.innerHTML = "";
  const flat = [];
  for (const [name, p] of Object.entries(products || {})) {
    for (const a of (p.insights?.anomalies || [])) flat.push({ product: name, msg: a });
  }
  if (flat.length === 0) {
    ul.appendChild(el("li", { class: "empty" }, "No anomalies detected in the latest run."));
    return;
  }
  for (const a of flat) {
    ul.appendChild(el("li", {}, `[${a.product}] ${a.msg}`));
  }
}

function renderHealth(products) {
  const root = document.getElementById("health");
  root.innerHTML = "";
  const names = Object.keys(products || {});
  if (names.length === 0) {
    root.appendChild(el("div", { class: "empty-state" }, "No events in the last hour."));
    return;
  }
  for (const name of names.sort()) {
    const h = products[name].health || {};
    const card = el("div", { class: "product-card" });
    card.appendChild(el("h3", {}, name));
    card.appendChild(el("div", { class: "metric-row" },
      el("span", { class: "label" }, "events"),
      el("span", {}, String(h.total_events_last_hour ?? 0))));
    card.appendChild(el("div", { class: "metric-row" },
      el("span", { class: "label" }, "success rate"),
      el("span", {}, fmt.pct(h.success_rate))));
    card.appendChild(el("div", { class: "metric-row" },
      el("span", { class: "label" }, "avg latency"),
      el("span", {}, fmt.ms(h.avg_latency_ms))));
    card.appendChild(el("div", { class: "metric-row" },
      el("span", { class: "label" }, "cost/hour"),
      el("span", {}, fmt.usd(h.cost_per_hour_usd))));
    root.appendChild(card);
  }
}

function renderInsights(products) {
  const root = document.getElementById("insights");
  root.innerHTML = "";
  const names = Object.keys(products || {});
  const withInsights = names.filter((n) => products[n].insights?.narrative);
  if (withInsights.length === 0) {
    root.appendChild(el("div", { class: "empty-state" },
      "No insights yet. Run python -m aggregation.summarizer."));
    return;
  }
  for (const name of withInsights.sort()) {
    const ins = products[name].insights;
    const block = el("div", { class: "insight" });
    block.appendChild(el("h3", {}, name));
    block.appendChild(el("p", { class: "narrative" }, ins.narrative));
    if (ins.recommendations && ins.recommendations.length) {
      const ul = el("ul");
      for (const r of ins.recommendations) ul.appendChild(el("li", {}, r));
      block.appendChild(ul);
    }
    root.appendChild(block);
  }
}

function renderFeed(events) {
  const tbody = document.getElementById("feed");
  tbody.innerHTML = "";
  if (!events || events.length === 0) {
    const tr = el("tr");
    tr.appendChild(el("td", { colspan: "7", class: "empty-state" }, "No recent events."));
    tbody.appendChild(tr);
    return;
  }
  for (const e of events) {
    const tr = el("tr");
    tr.appendChild(el("td", {}, fmt.time(e.timestamp)));
    tr.appendChild(el("td", {}, e.product || "—"));
    tr.appendChild(el("td", {}, e.event_type || "—"));
    const pillCls = `pill ${e.outcome || "ignored"}`;
    tr.appendChild(el("td", {}, el("span", { class: pillCls }, e.outcome || "—")));
    tr.appendChild(el("td", {}, fmt.ms(e.latency_ms)));
    tr.appendChild(el("td", {}, fmt.conf(e.confidence)));
    tr.appendChild(el("td", {}, e.model_provider || "—"));
    tbody.appendChild(tr);
  }
}

async function load() {
  try {
    const url = "../data/dashboard_data.json?_=" + Date.now();
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("fetch failed: " + resp.status);
    const data = await resp.json();

    document.getElementById("meta").textContent =
      "data " + fmt.time(data.generated_at) +
      "  |  insights " + (data.insights_generated_at ? fmt.time(data.insights_generated_at) : "—") +
      "  |  refresh 60s";

    renderAnomalies(data.products);
    renderHealth(data.products);
    renderInsights(data.products);
    renderFeed(data.live_feed);
  } catch (err) {
    document.getElementById("meta").textContent = "error: " + err.message;
    console.error(err);
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
