# Railway service configuration for the PulseWise collector (web service).
#
# This file applies to the `pulsewise-collector` service. The aggregator runs
# as a separate scheduled job — see DEPLOYMENT.md.

[build]
builder = "NIXPACKS"

[build.nixpacksPlan]
providers = ["python"]

[deploy]
startCommand = "uvicorn ingestion.collector:app --host 0.0.0.0 --port ${PORT:-8400} --workers 2 --proxy-headers"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
